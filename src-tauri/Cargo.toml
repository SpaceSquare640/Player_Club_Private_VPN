[package]
name = "player-club-private-vpn"
version = "0.51.5"
description = "Player Club Private VPN — a high-performance Gaming Virtual Network."
authors = ["Player Club"]
edition = "2021"
rust-version = "1.77.2"
# Required because this crate has a second binary target (src/bin/helper.rs,
# the elevation helper) alongside the main GUI app (src/main.rs). Without an
# explicit default-run, Tauri's bundler cannot reliably tell which compiled
# binary is "the app" to package — and got it wrong, bundling helper.exe as
# the installed application in v0.42.0's release (see CHANGELOG). This must
# stay in sync with `[package].name`; a bin target only auto-inherits the
# package name when it comes from `src/main.rs`, so nothing else here needs
# to change if the package is ever renamed.
default-run = "player-club-private-vpn"

# The library is shared between the desktop binary and the mobile entry points.
[lib]
name = "player_club_private_vpn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Networking engine (Phase A: telemetry spine). The async loop is hosted on
# Tauri's shared runtime; tokio provides the timer + watch-based shutdown.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
thiserror = "1"
# Seedable PRNG (StdRng) — reproducible telemetry runs when a seed is supplied,
# OS entropy otherwise. See engine::telemetry::simulator.
rand = "0.8"
# Phase C1: low-level socket options (SO_REUSEADDR) on the shared UDP transport.
socket2 = "0.5"
# Phase C2: Noise IK handshake + AEAD session, identity encoding, fingerprints.
snow = "0.9"
base64 = "0.22"
sha2 = "0.10"
# Zero the in-memory private key on drop (defense in depth).
zeroize = "1"
# Phase C3: CRC32 checksum for paste-corruption detection on signaling blobs.
crc32fast = "1"
# Phase D.2: Reed-Solomon erasure coding — recovers up to `r` lost packets per
# FEC group (D.1's XOR parity recovered only one). MIT; pulls parking_lot via
# the default `std` feature. `simd-accel` is deliberately NOT enabled (it needs
# a C toolchain and buys little at our packet rates).
reed-solomon-erasure = "6"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
# Opens Terms of Service / Privacy Policy / Wiki links in the user's default
# browser from the About/Legal settings section, rather than navigating the
# app's own webview away from the UI.
tauri-plugin-opener = "2"
# Frontend-side fetch() for the GitHub Releases API, used by the in-app
# "check for updates" feature (check-and-notify only — no auto-download/
# install, so no updater signing-key infrastructure is needed here).
tauri-plugin-http = "2"
tokio-tungstenite = "0.29.0"
futures-util = "0.3.33"

# --- Phase B: TUN/TAP (Windows backend) -------------------------------------
# wintun loads the bundled, signed wintun.dll at runtime to create/manage the
# virtual adapter. windows-sys provides the Win32 calls for elevation detection
# (token) and relaunch-elevated (ShellExecuteW). IP assignment uses `netsh`.
[target.'cfg(windows)'.dependencies]
wintun = "0.5"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# --- Linux/macOS TUN backends ------------------------------------------------
# libc gives raw access to open(2)/ioctl(2)/socket(2) etc. — the Linux
# backend opens /dev/net/tun directly (TUNSETIFF), and the macOS backend
# talks to the utun kernel-control socket (CTLIOCGINFO). Neither has a safe
# high-level crate equivalent to `wintun` worth pulling in for this.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Dependency pin (enforced via Cargo.lock): alloc-stdlib = 0.2.2 and
# brotli-decompressor = 5.0.1 keep the whole graph on alloc-no-stdlib 2.0.x.
# alloc-no-stdlib 3.0.0 is incompatible with brotli 8.0.3 (which pins 2.0.4
# directly) and triggers E0277 trait-bound errors. Do not run an unscoped
# `cargo update` that bumps these without re-verifying the build.

[features]
# Enabled by tauri when building for production to strip the dev server.
custom-protocol = ["tauri/custom-protocol"]
