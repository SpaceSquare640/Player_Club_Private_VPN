name: Feature request
description: Suggest an idea or improvement for the project.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended ideas or discussion before they're a concrete request,
        consider posting in [Discussions](https://github.com/SpaceSquare640/Player_Club_Private_VPN/discussions/categories/ideas) instead.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation or limitation that prompted this request.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you thought about, and why you didn't prefer them.

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Context, mockups, related issues, etc.
