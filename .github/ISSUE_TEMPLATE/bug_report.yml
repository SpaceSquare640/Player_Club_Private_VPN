name: Bug report
description: Report something that's broken or behaving unexpectedly.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. This project is pre-release
        alpha software, so rough edges are expected — but please still tell us
        about them.

        **Security vulnerability?** Do not file it here. Use
        [Security Advisories](https://github.com/SpaceSquare640/Player_Club_Private_VPN/security/advisories/new) instead.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Number the steps so they can be followed exactly.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version / commit
      description: Shown in Settings, or the tag/commit you built from.
      placeholder: v0.41.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Other (describe below)
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Adapter mode
      description: Basic mode, or Expert mode with the real Wintun adapter?
      options:
        - Basic
        - Expert (real adapter)
        - Not applicable
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or diagnostics output
      description: Copy from the Diagnostics view or your terminal. This is rendered as code automatically.
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
